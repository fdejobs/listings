name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: public/og
          key: og-${{ hashFiles('src/content/data/jobs.json') }}
          restore-keys: og-
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:og
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://fdejobs.github.io/listings' }}
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.WORKFLOW_PAT || github.token }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
